<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DobbsCore Settings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #1e293b;
            width: 280px;
            padding: 16px;
        }
        h1 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #0f172a;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        .label-text {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #64748b;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            color: #1e293b;
        }
        input:focus { outline: none; border-color: #2563eb; }
        .hint {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 3px;
        }
        button {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #16a34a;
            min-height: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>DobbsCore Settings</h1>

    <label>
        <span class="label-text">DobbsCore Server URL</span>
        <input id="serverUrl" type="url" placeholder="http://localhost:8080">
        <p class="hint">Base URL of your DobbsCore server.</p>
    </label>

    <label>
        <span class="label-text">Teacher Token</span>
        <input id="teacherToken" type="password" placeholder="Google access token">
        <p class="hint">Your Google OAuth access token from the teacher portal.</p>
    </label>

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
